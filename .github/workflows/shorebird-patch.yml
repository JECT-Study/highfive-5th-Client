# 긴급 수정 · Shorebird patch (Dart 코드만). Actions 탭에서 수동 실행.
# patch는 staging 트랙에 올라간다 → 검증 후 Shorebird 콘솔에서 stable로 수동 게시(rollback 가능).
# 네이티브 · 권한 · SDK · 에셋 변경은 patch 불가 → 앱 release로 배포.
name: Shorebird Patch

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor
        type: choice
        options: [prod, dev]
        required: true
      platform:
        description: Platform
        type: choice
        options: [both, android, ios]
        required: true
      release_version:
        description: Target release version (e.g. 1.0.0+42, Shorebird 콘솔에서 확인)
        type: string
        required: true

concurrency:
  group: shorebird-patch-${{ inputs.flavor }}
  cancel-in-progress: false

env:
  FLAVOR: ${{ inputs.flavor }}
  APP_ID: ${{ inputs.flavor == 'prod' && 'com.ject.highfive' || 'com.ject.highfive.dev' }}
  RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Shorebird patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch android \
            --flavor "$FLAVOR" \
            --target "lib/main_$FLAVOR.dart" \
            --release-version "$RELEASE_VERSION" \
            --track staging

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - id: signing
        uses: ./.github/actions/ios-signing
        with:
          certificate-base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_P12_PASSWORD }}
          profile-base64: ${{ env.FLAVOR == 'prod' && secrets.IOS_PROFILE_PROD_BASE64 || secrets.IOS_PROFILE_DEV_BASE64 }}
          bundle-id: ${{ env.APP_ID }}
          team-id: Q4E6NKD9VN
      - name: Shorebird patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch ios \
            --flavor "$FLAVOR" \
            --target "lib/main_$FLAVOR.dart" \
            --release-version "$RELEASE_VERSION" \
            --export-options-plist "${{ steps.signing.outputs.export-options }}" \
            --track staging
