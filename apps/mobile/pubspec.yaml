name: highfive
description: "highfive 5기 클라이언트 앱 (Flutter)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  characters: 1.4.1
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.4.0
  kakao_flutter_sdk_user: ^2.1.0
  google_sign_in: ^7.2.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  analyzer: ^14.7.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/icons/
  # Pretendard 1.3.9 (SIL OFL 1.1, assets/fonts/pretendard/LICENSE.txt). 디자인에 쓰는 굵기만 넣는다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 700
